# EidosBot System Configuration Template
# Copy to config.yaml and customize for your local setup

agent:
  max_steps: 50                  # Sense/act cycles per task. Desktop work needs more than a short reply.

models:
  provider_preference: "local"     # Options: "local", "cloud", "auto"
  
  local:
    base_url: "http://localhost:11434"
    reasoning_model: "batiai/gemma4-26b:iq4"  # If this model can see images, the vision model stays unloaded
    vision_model: "batiai/gemma4-12b:q6"      # Loaded only when the reasoning model has no vision capability
    chat_model: "gpt-oss:20b"
    timeout_seconds: 120

  cloud:
    provider: "chutes"
    base_url: "https://llm.chutes.ai/v1"
    api_key: "YOUR_CHUTES_API_KEY_HERE"
    vision_model: "Qwen/Qwen3.5-397B-A17B-TEE"        # Flagship 397B GUI/vision MoE (17B active)
    reasoning_model: "moonshotai/Kimi-K2.6-TEE"       # 1T MoE agentic reasoning & planning
    timeout_seconds: 180

safety:
  kill_switch_hotkey: "<ctrl>+<alt>+<esc>"
  
  # Confirmation Policy
  confirm_level_1_ui: false        # Require confirmation before mouse clicks and typing
  confirm_level_2_shell: true      # Require confirmation before running terminal commands
  confirm_level_3_destructive: true # ALWAYS TRUE (Cannot be disabled)

  storage:
    allowlist_file: "~/.eidos/allowlist.json"
    audit_log_file: "~/.eidos/audit.log"

perception:
  screen_scale_factor: 1.0         # 1.0 for native, 0.75 or 0.5 for faster LLM token processing
  max_fps: 5
  active_monitor_only: true

ui:
  hud_overlay_enabled: true
  target_reticle_duration_ms: 250
  status_pill:
    enabled: true
    position: "top-right"          # "top-right", "top-left", "bottom-right", "bottom-left"
    opacity: 0.92

integrations:
  optimalx:
    enabled: true
    cdp_port: 9222
    launch_command: "optimalx-desktop --remote-debugging-port=9222"

voice:
  enabled: true
  # Shares OptimalX Desktop's voice venv (run OptimalX voice/python/setup.sh once).
  python_path: null               # Auto: ~/OptimalX/voice/venv/bin/python, then ~/.venvs/optimalx-voice
  optimalx_voice_dir: null        # Auto: repo OptimalX_Voice/voice/python, then ~/OptimalX/electron/voice/python
  tts_voice: "bm_george"          # Kokoro voice (54 voices: bm_george, af_bella, am_adam, etc.)
  tts_speed: 1.0
  device: "cpu"                  # CPU preserves GPU VRAM for Ollama LLM
  push_to_talk_hotkey: "<ctrl>+<alt>+<space>"
  auto_speak_responses: true     # Speak every chat reply aloud (OptimalX growing windows: 80-140, 160-220, 380)
  auto_submit_transcription: true  # Send push-to-talk transcripts as the next chat turn

gateway:
  enabled: false                 # Remote mobile dashboard & WebSocket server
  host: "0.0.0.0"
  port: 8420
  auth_token: "CHANGE_ME_SECRET_TOKEN"
  
  telegram:
    enabled: false               # Telegram Bot for remote Human-In-The-Loop approvals and job monitoring
    bot_token: ""                # BotFather token (leave empty to use env var or ~/.eidos/telegram.token)
    bot_token_env: "EIDOS_TELEGRAM_BOT_TOKEN"
    token_file: "~/.eidos/telegram.token"
    allowed_user_ids: []         # Numerical Telegram User IDs permitted to interact (strict whitelist)
    remote_kill_switch_enabled: true  # Allow authorized users to trigger global emergency stop via /kill or card
    notifications:
      on_risk_approval: true     # Send interactive inline button cards when Risk Classifier blocks a command
      on_job_milestones: true    # Push progress updates for batch runner tasks (e.g. every N items or completion)
      on_task_completed: true    # Send final summary message when an agent task finishes

memory:
  enabled: true                  # Experiential trajectory logging and user profile memory
  user_profile_file: "~/.eidos/user_profile.yaml"
  trajectories_file: "~/.eidos/trajectories/episodes.jsonl"
  vector_store_path: "~/.eidos/memory/vector_store/episodic.db"  # Tier A local sqlite-vec store
  conversations_db_path: "~/.eidos/eidos.db"                     # Persistent SQLite chat conversations & message history
  embedding_model: "nomic-embed-text:latest"                     # 768-dim local embeddings on Ollama
  confirm_profile_writes: true   # HUD confirmation before agent saves profile facts

sandbox:
  enabled: true
  engine: "bwrap"                       # "bwrap" on Linux; "none" fallback
  default_workspace: "~/EidosWorkspace" # Default writeable directory
  
  # Paths that are mounted read-write inside the sandbox
  writable_paths:
    - "~/EidosWorkspace"

  # Security & Resource limits
  network_access: true                  # Set to false for strictly offline tasks
  max_memory_mb: 4096                   # Memory limit via cgroups / ulimit
  max_execution_time_sec: 60.0          # Process timeout
  allow_dev_gpu: true                   # Expose /dev/dri and NVIDIA devices for local compute

browser:
  headless: true                 # Run Chromium silently in background without desktop windows
  viewport_width: 1280
  viewport_height: 800
  screenshot_dir: "~/.eidos/screenshots/browser"

skills:
  directory: "~/EidosWorkspace/skills"
  project_directory: "~/EidosWorkspace/skills"

jobs:
  default_output_dir: "~/EidosWorkspace/jobs"

clock:
  timezone: null                 # null = use OS local timezone (e.g. "America/Chicago")


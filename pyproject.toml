[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidosbot"
version = "0.1.0"
description = "Local-first OS-level autonomous desktop agent"
authors = [{ name = "EidosBot Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "mss>=9.0.1",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "Pillow>=10.2.0",
    "PyQt6>=6.6.0",
    "websockets>=12.0",
    "playwright>=1.42.0"
]

[project.scripts]
eidos = "eidos.main:cli_entrypoint"
